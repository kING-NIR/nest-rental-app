version: '3.8'

services:
  mongodb:
    image: mongo:7.0
    container_name: nest-rental-mongodb
    ports:
      - '27017:27017'
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: admin
    volumes:
      - mongodb_data:/data/db
    networks:
      - nest-rental-network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: nest-rental-api
    ports:
      - '5000:5000'
    environment:
      NODE_ENV: development
      PORT: 5000
      MONGODB_URI: mongodb://admin:admin@mongodb:27017/nest-rental?authSource=admin
      JWT_SECRET: your_jwt_secret_key_change_in_production
      CORS_ORIGIN: http://localhost:3000
    depends_on:
      - mongodb
    volumes:
      - ./backend/src:/app/src
    networks:
      - nest-rental-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: nest-rental-ui
    ports:
      - '3000:3000'
    environment:
      REACT_APP_API_URL: http://localhost:5000/api
    depends_on:
      - backend
    networks:
      - nest-rental-network

volumes:
  mongodb_data:

networks:
  nest-rental-network:
    driver: bridge
